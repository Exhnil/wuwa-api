name: CICD
on:
    pull_request:
        branches:
            - master
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    integrate:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Validate data
              run: npm run validate:data

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: integrate
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Prepare SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$secrets.SSH_PRIVATE_KEY" > ~/.ssh/wuwa-api-deploy
                  chmod 600 ~/.ssh/wuwa-api-deploy

                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                    chmod 600 ~/.ssh/known_hosts

                  ssh \
                      -i ~/.ssh/github_wuwaplanner \
                      -o StrictHostKeyChecking=yes \
                      ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
                      "echo 'Connected to server:' && hostname && echo 'User:' && whoami"

            - name: Deploy
              run:
